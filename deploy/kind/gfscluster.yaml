apiVersion: gfs.gofs.io/v1alpha1
kind: GFSCluster
metadata:
  name: gfs
  namespace: default
  labels:
    app.kubernetes.io/name: gofs
spec:
  image:
    master: gofs-master:local
    chunkserver: gofs-chunkserver:local
    pullPolicy: IfNotPresent
  master:
    storage:
      size: 1Gi
  chunkservers:
    replicas: 3
    storage:
      size: 5Gi
  chunkSizeBytes: 67108864
  replicationFactor: 3
  leaseDuration: 60s
  heartbeatTimeout: 15s
  gcGrace: 1m
  maintenanceInterval: 10s
  http:
    serviceType: NodePort
    # kind-config.yaml maps host 127.0.0.1:8080 -> node 30080.
    nodePort: 30080
  monitoring:
    serviceMonitorLabels:
      release: kube-prometheus-stack
    grafanaDashboardLabels:
      grafana_dashboard: "1"
