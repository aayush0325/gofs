apiVersion: v1
kind: Service
metadata:
  name: gofs-operator-ui-nodeport
  namespace: gofs-operator-system
  labels:
    app.kubernetes.io/name: gofs-operator
    app.kubernetes.io/component: console
spec:
  type: NodePort
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: gofs-operator
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      nodePort: 30090
      protocol: TCP
